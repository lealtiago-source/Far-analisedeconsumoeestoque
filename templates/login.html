<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
          {% for msg in messages %}
            <li style="color:red">{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <form method="POST">
        <label>Usuário: <input type="text" name="usuario"></label><br><br>
        <label>Senha: <input type="password" name="senha"></label><br><br>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
